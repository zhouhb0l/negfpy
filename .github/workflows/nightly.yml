name: hosted-bounded-validation

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  bounded-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install report inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation poppler-utils
      - name: Build clean wheel
        run: |
          python -m pip install "build>=1" "h5py>=3" "pytest>=8" "matplotlib>=3.7" "pillow>=10"
          python -m build --wheel --outdir dist
          python -m pip install dist/*.whl
      - name: Prove tests import the wheel
        run: |
          python -c "import pathlib, negfpy; path=pathlib.Path(negfpy.__file__).resolve(); assert not path.is_relative_to(pathlib.Path.cwd().resolve()), path"
      # Heavy release gates run only on the designated key-only workstation.
      # Hosted runners never connect to private machines.
      - name: Full bounded fresh-wheel suite
        run: python -m pytest -q -m "not nightly"
      - name: Report artifact pipeline with strict warnings
        run: |
          python -m pytest -W error -q \
            docs/validation/toy-model-report/tests/test_import_current_publication.py \
            docs/validation/toy-model-report/tests/test_render_production_toy_gate_figures.py \
            docs/validation/toy-model-report/tests/test_render_historical_paper_benchmarks.py
      - name: Dense toy smoke calculation
        run: python examples/anharmonic_toy_scba.py
