name: hosted-bounded-validation

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  bounded-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      # Heavy release gates run only on the designated key-only workstation.
      # Hosted runners never connect to private machines.
      - name: Full bounded suite
        run: python -m pytest -q -m "not nightly"
      - name: Dense toy smoke calculation
        run: python examples/anharmonic_toy_scba.py
