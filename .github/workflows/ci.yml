name: pull-request-ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      # Keep this as normal discovery rather than a hand-maintained file
      # list: every new small, unmarked validation test belongs in PR CI.
      - name: Full non-nightly suite
        run: python -m pytest -q -m "not nightly"
      - name: Toy SCBA smoke calculation
        run: python examples/anharmonic_toy_scba.py
