name: Publish verified negfpp 1.1.0 tag

on:
  push:
    branches:
      - 'release/publish-negfpp-1.1.0'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RELEASE_TAG: negfpp-v1.1.0
      RELEASE_COMMIT: 6bd75ca83ef06b1b54fdf153a55590d842f2aca4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: negfpp-v1.1.0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies and build tools
        run: python -m pip install -r requirements-tested.txt 'pytest>=8' 'build==1.2.2.post1' 'wheel==0.44.0' 'setuptools==75.3.0'
      - name: Check release version
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'negfpp-v' + version
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', os.environ['RELEASE_TAG'] + '^{commit}'], text=True).strip()
          assert actual == tagged == os.environ['RELEASE_COMMIT']
          PY
      - name: Install project metadata for source tests
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Test clean source
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Build packages
        run: python -m build --no-isolation --sdist --wheel
      - name: Check installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          negfpp --version
          python -m pip check
      - name: Create artifact checksums and release notes
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python - <<'PY'
          from pathlib import Path
          lines = Path('CHANGELOG.md').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith('## '))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          Path('/tmp/negfpp-release-notes.md').write_text('\n'.join(lines[start + 1:end]).strip() + '\n')
          PY
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "negfpp ${RELEASE_TAG#negfpp-v}" --notes-file /tmp/negfpp-release-notes.md
