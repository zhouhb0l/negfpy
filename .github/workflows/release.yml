name: Build and publish negfpp release

on:
  push:
    tags:
      - 'negfpp-v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies and build tools
        run: python -m pip install -r requirements-tested.txt 'pytest>=8' 'build==1.2.2.post1' 'wheel==0.44.0' 'setuptools==75.3.0'
      - name: Check release version
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'negfpp-v' + version
          PY
      - name: Install clean source for tests
        run: python -m pip install --no-deps .
      - name: Test clean source
        run: python -m pytest -q
      - name: Build packages
        run: python -m build --no-isolation --sdist --wheel
      - name: Check installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          negfpp --version
          python -m pip check
      - name: Create artifact checksums and release notes
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python - <<'PY'
          from pathlib import Path
          lines = Path('CHANGELOG.md').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith('## '))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          Path('/tmp/negfpp-release-notes.md').write_text('\n'.join(lines[start + 1:end]).strip() + '\n')
          PY
      - name: Publish versioned packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "negfpp ${GITHUB_REF_NAME#negfpp-v}" --notes-file /tmp/negfpp-release-notes.md
