[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negfpp"
version = "1.2.0"
description = "Phonon-phonon NEGF with native-channel cubic SCBA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3,<4",
  "numpy>=2,<3",
  "scipy>=1.11,<2",
  "spglib==2.7.0",
  "threadpoolctl>=3",
  "phono3py==4.4.0",
  "phonopy==4.4.0",
]

[project.scripts]
negfpp = "negfpp.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "negfpp*",
  "negfpy",
  "negfpy.anharmonic*",
  "negfpy.core*",
  "negfpy.models*",
]

[tool.setuptools.package-data]
negfpy = ["_build_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "nightly: optional checks requiring larger resource budgets",
]
