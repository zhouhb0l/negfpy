[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "negfpy"
version = "0.1.0rc1"
description = "Phonon NEGF development"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "threadpoolctl>=3"]

[project.optional-dependencies]
fc3 = ["h5py>=3"]
mpi = ["mpi4py>=4"]
report = ["h5py>=3", "matplotlib>=3.7", "pillow>=10"]
test = ["h5py>=3", "pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
negfpy = ["_build_provenance.json"]

[tool.pytest.ini_options]
markers = [
  "nightly: bounded validation cases that are too costly for pull-request CI",
]
